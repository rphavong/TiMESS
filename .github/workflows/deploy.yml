name: Deploy

# Runs only after the "CI" workflow (ci.yml) finishes on main --
# not on push directly. This is what closes the race condition:
# without this, Deploy and CI both started on the same push and
# nothing guaranteed CI's image push finished before Deploy tried to
# pull it.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # Only proceed if CI actually succeeded -- if tests failed or the
    # image push failed, there's nothing valid to deploy yet.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_mem0_api_key: ${{ secrets.MEM0_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init
        working-directory: infra

      - name: Terraform apply
        run: terraform apply -auto-approve -var="key_pair_name=${{ secrets.EC2_KEY_PAIR_NAME }}"
        working-directory: infra

      - name: Get EC2 public IP
        id: get_ip
        run: echo "ip=$(terraform output -raw ec2_public_ip)" >> "$GITHUB_OUTPUT"
        working-directory: infra

      - name: Deploy containers via SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ steps.get_ip.outputs.ip }}
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$SSH_KEY" > key.pem
          chmod 600 key.pem

          # Copy the PRODUCTION compose file (pulls pre-built images)
          # -- not docker-compose.yml, which builds from local source
          # and is meant for your Mac only.
          scp -i key.pem -o StrictHostKeyChecking=no docker-compose.prod.yml ec2-user@$HOST:~/docker-compose.yml

          # Write .env on the server via stdin (not as a command-line
          # argument) so the secret value never shows up in the
          # remote shell's process list.
          ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@$HOST "cat > .env" <<< "MEM0_API_KEY=$MEM0_API_KEY"

          # Log in to GHCR so `docker-compose pull` can fetch your
          # images -- required unless you've made the GHCR packages
          # public (see the lab notes).
          ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@$HOST \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u rphavong --password-stdin"

          ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@$HOST \
            "docker-compose pull && docker-compose up -d"

      - name: Smoke test (curl)
        run: |
          HOST="${{ steps.get_ip.outputs.ip }}"

          echo "Waiting for backend health check..."
          for i in $(seq 1 20); do
            if curl -sf "http://$HOST:8000/health" > /dev/null; then
              echo "Backend is up."
              break
            fi
            echo "Not ready yet, retrying in 15s... ($i/20)"
            sleep 15
          done

          echo "Waiting for a real chat response (may take several minutes on first deploy while Ollama downloads its model)..."
          for i in $(seq 1 30); do
            if curl -sf -X POST "http://$HOST:8000/api/chat" \
              -H "Content-Type: application/json" \
              -d '{"user_id":"smoke-test","query":"What is Xenium used for?"}'; then
              echo ""
              echo "Chat endpoint responded successfully."
              echo "App is live at: http://$HOST:8501"
              exit 0
            fi
            echo "Not ready yet, retrying in 20s... ($i/30)"
            sleep 20
          done

          echo "Chat endpoint never became ready in time."
          exit 1
